name: "Build docs"
description: "Build the docs"

runs:
  using: "composite"
  steps:
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
      with:
        mdbook-version: "0.4.37"

    - name: Cache dependencies
      uses: swatinem/rust-cache@v2
      with:
        # 只在dev分支使用缓存（包括恢复和保存）
        shared-key: ${{ github.workflow }}-dev-${{ hashFiles('**/Cargo.lock') }}
        key: ${{ runner.os }}-rust-dev-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-dev-
        save-if: ${{ github.ref == 'refs/heads/dev' }}

    - name: Install Linux dependencies
      shell: bash -euxo pipefail {0}
      run: ./script/linux

    # - name: Check for broken links (in MD)
    #   uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
    #   with:
    #     args: --no-progress --exclude '^http' './docs/cnsrc/src/**/*'
    #     fail: true

    - name: Build book
      shell: bash -euxo pipefail {0}
      run: |
        mkdir -p target/deploy
        mdbook build ./docs/cnsrc --dest-dir=../target/deploy/docs/

    # - name: Check for broken links (in HTML)
    #   uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
    #   with:
    #     args: --no-progress --exclude '^http' 'target/deploy/docs/'
    #     fail: true
